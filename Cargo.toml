[package]
name = "git-graft"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
description = "Faster, lighter replacement for git worktree, built for coding agents"
license = "MIT"
repository = "https://github.com/mprync/git-graft"
homepage = "https://github.com/mprync/git-graft"
documentation = "https://github.com/mprync/git-graft#readme"
readme = "README.md"
keywords = ["git", "worktree", "agents", "mcp", "copy-on-write"]
categories = ["command-line-utilities", "development-tools"]
# Ship only what a build and `cargo test` need.
include = [
    "src/**",
    "tests/**",
    "Cargo.toml",
    "Cargo.lock",
    "README.md",
    "LICENSE",
    "CHANGELOG.md",
    "docs/man/git-graft.1",
]

[dependencies]
flate2 = "1"
sha1-checked = { version = "0.10", default-features = false }
anyhow = "1"
blake3 = "1"
clap = { version = "4", features = ["derive", "env"] }
dunce = "1"
glob = "0.3"
libc = "0.2"
rmcp = { version = "3.11.0", default-features = false, features = ["server", "transport-io"] }
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.11"
sha2 = "0.11"
tempfile = "3"
tokio = { version = "1", features = ["rt", "io-std"] }
toml = { version = "1", default-features = false, features = ["parse", "serde", "std"] }
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
# Generates docs/man/git-graft.1 so `git graft --help` opens a manual page.
clap_mangen = "0.3"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Storage_FileSystem"] }

[profile.dev]
debug = 1
incremental = false

[profile.release]
opt-level = "s"
lto = "thin"
codegen-units = 1
strip = "symbols"
