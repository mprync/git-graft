[package]
name = "git-graft"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
description = "Copy-on-write Git workspaces for people and coding agents"
license = "MIT"
keywords = ["git", "worktree", "mcp", "reflink"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
anyhow = "1"
blake3 = "1"
clap = { version = "4", features = ["derive", "env"] }
dunce = "1"
libc = "0.2"
rmcp = { version = "3.5.1", default-features = false, features = ["server", "transport-io"] }
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
tokio = { version = "1", features = ["rt", "io-std"] }
uuid = { version = "1", features = ["v4"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Storage_FileSystem"] }

[profile.dev]
debug = 1
incremental = false

[profile.release]
opt-level = "s"
lto = "thin"
codegen-units = 1
strip = "symbols"
