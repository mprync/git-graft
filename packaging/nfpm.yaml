# nfpm configuration for the Linux packages (.deb, .rpm, .apk, Arch .pkg.tar.zst).
# Driven by the release workflow, which sets these environment variables:
#   VERSION      release version without the leading "v" (for example 0.1.0)
#   ARCH         amd64 or arm64
#   BINARY_PATH  path to the matching musl-linked git-graft binary
#   LICENSE_PATH path to the repository LICENSE file
#   MAN_PATH     path to the git-graft.1 manual page
#
#   VERSION=0.1.0 ARCH=amd64 BINARY_PATH=target/x86_64-unknown-linux-musl/release/git-graft \
#     LICENSE_PATH=LICENSE nfpm package -f packaging/nfpm.yaml -p deb
name: git-graft
arch: ${ARCH}
platform: linux
version: ${VERSION}
version_schema: semver
section: vcs
priority: optional
maintainer: mprync <mprync@users.noreply.github.com>
description: |
  Copy-on-write Git workspaces for people and coding agents.
  Run as `git graft`. Requires Git 2.46 or newer at runtime.
vendor: mprync
homepage: https://github.com/mprync/git-graft
license: MIT

contents:
  - src: ${BINARY_PATH}
    dst: /usr/bin/git-graft
    file_info:
      mode: 0755
  - src: ${LICENSE_PATH}
    dst: /usr/share/doc/git-graft/LICENSE
    file_info:
      mode: 0644
  - src: ${MAN_PATH}
    dst: /usr/share/man/man1/git-graft.1
    file_info:
      mode: 0644

# The binary is statically linked (musl). Git is the only runtime dependency; the
# version floor (2.46) is documented rather than enforced because older distributions
# would otherwise be unable to install the package at all.
overrides:
  deb:
    depends:
      - git
  rpm:
    depends:
      - git-core
  apk:
    depends:
      - git
  archlinux:
    depends:
      - git
