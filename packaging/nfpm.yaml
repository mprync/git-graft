# nfpm configuration for the Linux packages (.deb, .rpm, .apk, Arch .pkg.tar.zst).
# Driven by the release workflow. It unpacks one release archive into ./stage
# (git-graft, LICENSE and git-graft.1) and sets these environment variables:
#   VERSION  release version without the leading "v" (for example 0.1.0)
#   ARCH     amd64 or arm64
# nfpm expands variables only in fields such as arch and version, never in
# contents paths, so the files come from the fixed stage directory.
#
#   mkdir stage && tar -xzf git-graft-0.1.0-x86_64-unknown-linux-musl.tar.gz -C stage --strip-components=1
#   VERSION=0.1.0 ARCH=amd64 nfpm package -f packaging/nfpm.yaml -p deb
name: git-graft
arch: ${ARCH}
platform: linux
version: ${VERSION}
version_schema: semver
section: vcs
priority: optional
maintainer: mprync <mprync@users.noreply.github.com>
description: |
  Faster, lighter replacement for git worktree, built for coding agents.
  Run as `git graft`. Requires Git 2.46 or newer at runtime.
vendor: mprync
homepage: https://github.com/mprync/git-graft
license: MIT

contents:
  - src: ./stage/git-graft
    dst: /usr/bin/git-graft
    file_info:
      mode: 0755
  - src: ./stage/LICENSE
    dst: /usr/share/doc/git-graft/LICENSE
    file_info:
      mode: 0644
  - src: ./stage/git-graft.1
    dst: /usr/share/man/man1/git-graft.1
    file_info:
      mode: 0644

# The binary is statically linked (musl). Git is the only runtime dependency; the
# version floor (2.46) is documented rather than enforced because older distributions
# would otherwise be unable to install the package at all.
overrides:
  deb:
    depends:
      - git
  rpm:
    depends:
      - git-core
  apk:
    depends:
      - git
  archlinux:
    depends:
      - git
